<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    header h1 a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 32px;
    }

    header p {
      color: #8b949e;
      font-size: 18px;
      margin: 15px 0 25px;
    }

    .button {
      display: inline-block;
      margin: 6px;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 6px;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
      background: #238636;
      color: white;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #2ea043;
    }

    .github-button,
    .coffee-button {
      background: #238636;
      color: white;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
    }

    .header-content {
      text-align: center;
    }

    .anime-side {
      width: 240px;
      height: auto;
    }

    @media (max-width: 700px) {
      .header-container {
        flex-direction: column;
        gap: 15px;
      }

      .anime-side {
       width: 200px;
      }
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 25px;
    }

    h1, h2, h3 {
      color: #f0f6fc;
    }

    a {
      color: #58a6ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
    }

    th {
      background: #161b22;
      color: #f0f6fc;
    }

    td, th {
      border: 1px solid #30363d;
      padding: 10px;
    }

    tr:nth-child(even) {
      background: #161b22;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 50px;
      background: #161b22;
      border-top: 1px solid #30363d;
      color: #8b949e;
    }
  </style>

</head>

<body>

<header>

  <div class="header-container">

    <img src="../assets/images/deal-with-it-trailblazer.gif"
         class="anime-side"
         alt="Anime decoration">


    <div class="header-content">

      <h1>
        <a href="{{ '/' | relative_url }}">
          ℙ𝕣𝕠𝕞𝕡𝕥 𝔼𝕟𝕘𝕚𝕟𝕖𝕖𝕣𝕚𝕟𝕘 ℍ𝕠𝕝𝕪 𝔾𝕣𝕒𝕚𝕝
        </a>
      </h1>

      <p>
        A curated resource for prompt engineering, LLMs, and AI workflows.
      </p>


      <a href="https://github.com/Bugatsec/Prompt-Engineering-Holy-Grail"
         target="_blank"
         class="button github-button">

        ⭐ Star on GitHub:
        <span id="star-count">0</span>

      </a>


      <a href="https://github.com/Bugatsec/Prompt-Engineering-Holy-Grail"
         target="_blank"
         class="button coffee-button">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.38.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.94 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.49 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
        </svg>

        View Repository

      </a>

    </div>


    <img src="../assets/images/deal-with-it-trailblazer.gif"
         class="anime-side"
         alt="Anime decoration">

  </div>

</header>


<main>

{{ content }}

</main>


<footer>

<p>
Originally created by Zac Frulloni.
</p>

<p>
Preserved and maintained by Ranveer Kohli (Bugatsec).
</p>

<p>
Built with GitHub Pages and Jekyll.
</p>

</footer>


<script>

fetch("https://api.github.com/repos/Bugatsec/Prompt-Engineering-Holy-Grail")
.then(response => response.json())
.then(data => {

document.getElementById("star-count").textContent =
data.stargazers_count || "0";

})
.catch(() => {

document.getElementById("star-count").textContent = "0";

});

</script>


</body>
</html>
