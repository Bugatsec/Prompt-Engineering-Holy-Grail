<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    header h1 a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 32px;
    }

    header p {
      color: #8b949e;
      font-size: 18px;
      margin: 15px 0 25px;
    }

    .button {
      display: inline-block;
      margin: 6px;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .github-button {
      background: #238636;
      color: white;
    }

    .coffee-button {
      background: #ffdd57;
      color: #111;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 25px;
    }

    h1, h2, h3 {
      color: #f0f6fc;
    }

    a {
      color: #58a6ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
    }

    th {
      background: #161b22;
      color: #f0f6fc;
    }

    td, th {
      border: 1px solid #30363d;
      padding: 10px;
    }

    tr:nth-child(even) {
      background: #161b22;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 50px;
      background: #161b22;
      border-top: 1px solid #30363d;
      color: #8b949e;
    }
  </style>

</head>

<body>

<header>

  <h1>
    <a href="{{ '/' | relative_url }}">
      Prompt Engineering Holy Grail
    </a>
  </h1>

  <p>
    A curated resource for prompt engineering, LLMs, and AI workflows.
  </p>


  <a href="https://github.com/Bugatsec/Prompt-Engineering-Holy-Grail"
     target="_blank"
     class="button github-button">

    Star on GitHub:
    <span id="star-count">0</span>

  </a>


  <a href="https://github.com/Bugatsec/Prompt-Engineering-Holy-Grail"
     target="_blank"
     class="button coffee-button">

    View Repository

  </a>


</header>


<main>

{{ content }}

</main>


<footer>

<p>
Originally created by Zac Frulloni.
</p>

<p>
Preserved and maintained by Ranveer Kohli (Bugatsec).
</p>

<p>
Built with GitHub Pages and Jekyll.
</p>

</footer>


<script>

fetch("https://api.github.com/repos/Bugatsec/Prompt-Engineering-Holy-Grail")
.then(response => response.json())
.then(data => {

document.getElementById("star-count").textContent =
data.stargazers_count || "0";

})
.catch(() => {

document.getElementById("star-count").textContent = "0";

});

</script>


</body>
</html>
